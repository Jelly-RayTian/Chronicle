[package]
name = "chronicle"
version = "1.2.0"
description = "A privacy-first local timeline for file activity"
authors = ["Chronicle contributors"]
edition = "2024"
rust-version = "1.96"

[lib]
name = "chronicle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "chronicle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
